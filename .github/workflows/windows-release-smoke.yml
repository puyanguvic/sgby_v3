name: Windows Release Smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.17)
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-2022
    steps:
      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            "tag=${{ github.event.release.tag_name }}" >> $env:GITHUB_OUTPUT
          } else {
            "tag=${{ inputs.tag }}" >> $env:GITHUB_OUTPUT
          }

      - name: Download release zip
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          gh release download $tag -R "${{ github.repository }}" -p "iBaye-godot-windows-*.zip" -D .

      - name: Run smoke test
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Filter "iBaye-godot-windows-*.zip" | Select-Object -First 1
          if (-not $zip) { throw "Release zip not found after download." }
          $work = Join-Path $env:RUNNER_TEMP ("ibaye-smoke-" + [Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $work | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath $work -Force

          $exe = Join-Path $work "iBaye.exe"
          $probe = Join-Path $work "RuntimeProbe.ps1"
          $logDir = Join-Path $work "logs"
          $ibayeLog = Join-Path $logDir "ibaye_startup.log"
          $hostTrace = Join-Path $logDir "dotnet_host_trace.log"

          foreach ($f in @($exe, $probe)) {
            if (-not (Test-Path -LiteralPath $f -PathType Leaf)) { throw "Missing file: $f" }
          }

          powershell -NoProfile -ExecutionPolicy Bypass -File $probe

          New-Item -ItemType Directory -Path $logDir -Force | Out-Null
          $cmd = "set COREHOST_TRACE=1 && set COREHOST_TRACEFILE=""$hostTrace"" && ""$exe"" --verbose --log-file ""$ibayeLog"""
          $p = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", $cmd -PassThru
          if (-not $p.WaitForExit(20000)) {
            $p.Kill()
          }

          if (-not (Test-Path -LiteralPath $ibayeLog -PathType Leaf)) {
            throw "ibaye_startup.log not found"
          }
          $log = Get-Content -LiteralPath $ibayeLog -Raw
          if ($log -match "No loader found for resource: res://scripts/.+\.cs") {
            throw "Detected C# loader failure in startup log."
          }
          if ($log -match "Failed loading scene: res://scenes/main/Main\.tscn") {
            throw "Detected main scene loading failure."
          }

          Write-Host "Smoke passed. ExitCode=$($p.ExitCode)"
