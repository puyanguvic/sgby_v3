name: Windows Build And Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Keep release checkout minimal.
          submodules: false
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            mingw-w64 \
            zip

      - name: Resolve app version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "This workflow only runs for tags."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"

          echo "APP_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Using APP_VERSION=${version}"

      - name: Build Windows portable package
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build_windows_from_ubuntu.sh
          APP_VERSION="${APP_VERSION}" ./build_windows_from_ubuntu.sh

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum ./* > SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iBaye-windows-${{ env.APP_VERSION }}
          path: |
            release/iBaye-windows-portable-${{ env.APP_VERSION }}.zip
            release/SHA256SUMS.txt

      - name: Create GitHub release for tag
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/iBaye-windows-portable-${{ env.APP_VERSION }}.zip
            release/SHA256SUMS.txt
