name: Windows Release Policy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-release-policy:
    runs-on: ubuntu-22.04
    steps:
      - name: Publish policy notice
        run: |
          echo "Windows release binaries are no longer built on GitHub Actions."
          echo "Use local export + upload:"
          echo "  ./scripts/publish_godot_windows_release.sh --version=<ver> --tag=v<ver> --push-tag"
